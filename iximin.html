<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHIVE_DATABASE | 作品库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root { --bg-color: #050505; --text-color: #FFFFFF; --accent-color: #888888; --wedge-color: #FFFFFF; --line-color: #222222; }
        body.light-mode { --bg-color: #FFFFFF; --text-color: #050505; --accent-color: #555555; --wedge-color: #050505; --line-color: #E0E0E0; }
        body { background: var(--bg-color); overflow: hidden; font-family: 'Arial Black', 'Microsoft YaHei', sans-serif; color: var(--text-color); height: 100vh; cursor: crosshair; }

        .bg-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .block-wedge { position: absolute; top: -20%; left: -20%; width: 90vw; height: 140vh; background: var(--wedge-color); clip-path: polygon(0 0, 100% 0, 55% 100%, 0% 100%); animation: slideWedge 8s infinite alternate; }
        .block-grey { position: absolute; top: 15%; right: 5%; width: 25vw; height: 25vw; background: var(--accent-color); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation: rotateTriangle 6s infinite alternate; }
        .line-rule { position: absolute; top: 50%; left: -10%; width: 120vw; height: 4px; background: var(--line-color); transform: rotate(-15deg); z-index: 3; }
        @keyframes slideWedge { 0% { transform: translateX(-5%) skewX(-5deg); } 100% { transform: translateX(5%) skewX(5deg); } }
        @keyframes rotateTriangle { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(20px) rotate(15deg); } }

        #ui-layer { position: absolute; inset: 0; z-index: 10; padding: 4vh 4vw; display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
        .content-box { width: 100%; max-width: 900px; height: 100%; display: flex; flex-direction: column; pointer-events: auto; }

        .header-data { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text-color); padding-bottom: 1vh; font-family: 'Courier New', monospace; margin-bottom: 2vh; width: 100%; }
        .header-data span { font-size: clamp(12px, 1.2vw, 18px); color: var(--accent-color); }
        .menu-trigger { color: var(--text-color); cursor: pointer; font-weight: bold; text-decoration: none; }
        .theme-toggle { position: fixed; top: 4vh; right: 4vw; z-index: 100; width: clamp(80px, 8vw, 120px); height: clamp(30px, 4vh, 45px); background: var(--text-color); color: var(--bg-color); border: none; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); cursor: pointer; font-family: 'Courier New'; font-size: clamp(12px, 1.2vw, 16px); font-weight: 900; display: flex; justify-content: center; align-items: center; transition: 0.4s;}

        .article-list { flex: 1; overflow-y: auto; padding-right: 10px; width: 100%; }
        .article-list::-webkit-scrollbar { width: 6px; }
        .article-list::-webkit-scrollbar-thumb { background: var(--accent-color); }

        .article-item { display: flex; align-items: center; justify-content: space-between; background: rgba(100, 100, 100, 0.05); border-left: 4px solid var(--text-color); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); padding: clamp(15px, 2vw, 30px); margin-bottom: clamp(10px, 1.5vh, 20px); cursor: pointer; transition: all 0.2s; backdrop-filter: blur(5px); }
        .article-item:hover { background: var(--text-color); color: var(--bg-color); transform: translateX(15px); border-left: 4px solid var(--accent-color); }
        .article-info { display: flex; flex-direction: column; gap: 1vh; flex: 1; overflow: hidden; }
        .article-title { font-family: 'Microsoft YaHei'; font-size: clamp(16px, 1.8vw, 26px); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        @media screen and (max-height: 500px) {
            #ui-layer { padding: 2vh 3vw; }
            .content-box { max-width: calc(100vw - 120px); } 
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">[ REVERSE ]</button>
    <div class="bg-layer"><div class="block-wedge"></div><div class="block-grey"></div><div class="line-rule"></div></div>

    <div id="ui-layer">
        <div class="content-box">
            <div class="header-data">
                <a href="index.html" class="menu-trigger">[ < RETURN_HOME ]</a>
                <span style="color: var(--accent-color);">[ ARCHIVE_BOOKS ]</span>
            </div>
            <div class="article-list" id="article-list-container">
                <div style="text-align:center; padding: 40px; color: var(--text-color); font-family:'Courier New';">正在解析书架...</div>
            </div>
        </div>
    </div>

    <script>
        // 🚨 替换成你的 data.json Raw 链接
        const GITHUB_DATA_URL = 'https://raw.githubusercontent.com/XIEMINZCIME/xie-mi/main/data.json';

        async function fetchSeries() {
            const listContainer = document.getElementById('article-list-container');
            try {
                const response = await fetch(GITHUB_DATA_URL);
                const posts = await response.json();
                const uniqueSeries = [...new Set(posts.map(p => p.series))];

                listContainer.innerHTML = "";
                uniqueSeries.forEach(seriesName => {
                    const item = document.createElement('div');
                    item.className = 'article-item';
                    item.onclick = () => window.location.href = `iximi.html?series=${encodeURIComponent(seriesName)}`; 
                    item.innerHTML = `
                        <div class="article-info">
                            <div class="article-title">${seriesName}</div>
                        </div>
                        <div class="article-id" style="font-size:24px; color: var(--accent-color);">[ BOOK ]</div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (error) {
                listContainer.innerHTML = `<div style="color:#FF3333; padding:20px;">[ 数据读取失败，请检查网络或链接 ]</div>`;
            }
        }
        
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
        fetchSeries();
    </script>
</body>
</html>
