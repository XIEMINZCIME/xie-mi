<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IXIMIN | 归档档案</title>
    
    <!-- 🚨 引入你的数据文件 -->
    <script src="posts.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root { --bg-color: #050505; --text-color: #FFFFFF; --accent-color: #888888; --wedge-color: #FFFFFF; --line-color: #222222; }
        body.light-mode { --bg-color: #FFFFFF; --text-color: #050505; --accent-color: #555555; --wedge-color: #050505; --line-color: #E0E0E0; }
        body { background: var(--bg-color); overflow: hidden; font-family: 'Arial Black', 'Microsoft YaHei', sans-serif; color: var(--text-color); height: 100vh; transition: background 0.4s; cursor: crosshair; }

        .bg-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; overflow: hidden; }
        .block-wedge { position: absolute; top: -20%; left: -20%; width: 90vw; height: 140vh; background: var(--wedge-color); clip-path: polygon(0 0, 100% 0, 55% 100%, 0% 100%); animation: slideWedge 8s infinite alternate; }
        .block-grey { position: absolute; top: 15%; right: 5%; width: 25vw; height: 25vw; background: var(--accent-color); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation: rotateTriangle 6s infinite alternate; }
        .line-rule { position: absolute; top: 50%; left: -10%; width: 120vw; height: 4px; background: var(--line-color); transform: rotate(-15deg); z-index: 3; }
        @keyframes slideWedge { 0% { transform: translateX(-5%) skewX(-5deg); } 100% { transform: translateX(5%) skewX(5deg); } }
        @keyframes rotateTriangle { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(20px) rotate(15deg); } }

        #ui-layer { position: absolute; inset: 0; z-index: 10; padding: 4vh 4vw; display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
        .content-box { width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: auto; }

        .header-data { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text-color); padding-bottom: 1vh; font-family: 'Courier New', monospace; margin-bottom: 2vh; width: 100%; }
        .header-data span { font-size: clamp(12px, 1.2vw, 18px); color: var(--accent-color); }
        .header-data #time-display { color: var(--text-color); font-weight: bold; }
        .menu-trigger { color: var(--text-color); cursor: pointer; font-weight: bold; text-decoration: none; }
        
        .theme-toggle { position: fixed; top: 4vh; right: 4vw; z-index: 100; width: clamp(80px, 8vw, 120px); height: clamp(30px, 4vh, 45px); background: var(--text-color); color: var(--bg-color); border: none; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); cursor: pointer; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-family: 'Courier New'; font-size: clamp(12px, 1.2vw, 16px); font-weight: 900; transition: 0.4s; }

        .search-box { margin-bottom: 2vh; display: flex; width: 100%; }
        .search-box input { flex: 1; background: rgba(100,100,100,0.1); border: 1px solid var(--accent-color); color: var(--text-color); padding: 1.5vh 1.5vw; font-family: 'Courier New', monospace; font-size: clamp(14px, 1.5vw, 20px); outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--text-color); background: transparent; }
        .search-box input::placeholder { color: var(--accent-color); letter-spacing: 1px; }

        .article-list { flex: 1; overflow-y: auto; padding-right: 10px; width: 100%; }
        .article-list::-webkit-scrollbar { width: 6px; }
        .article-list::-webkit-scrollbar-thumb { background: var(--accent-color); }

        .article-item { display: flex; align-items: center; justify-content: space-between; background: rgba(100, 100, 100, 0.05); border-left: 4px solid var(--text-color); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); padding: clamp(15px, 2vw, 30px); margin-bottom: clamp(10px, 1.5vh, 20px); cursor: pointer; transition: all 0.2s cubic-bezier(0, 0, 0.2, 1); backdrop-filter: blur(5px); }
        .article-item:hover { background: var(--text-color); color: var(--bg-color); transform: translateX(15px); border-left: 4px solid var(--accent-color); }

        .article-info { display: flex; flex-direction: column; gap: 1vh; flex: 1; overflow: hidden; }
        .article-title { font-family: 'Microsoft YaHei'; font-size: clamp(16px, 1.8vw, 26px); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .article-meta { font-family: 'Courier New'; font-size: clamp(11px, 1.2vw, 16px); color: var(--accent-color); }
        .article-item:hover .article-meta { color: #444; }

        .article-id { font-family: 'Arial Black', Impact; font-size: clamp(28px, 3vw, 48px); color: transparent; -webkit-text-stroke: 1px var(--text-color); transition: all 0.2s; margin-left: 2vw; }
        .article-item:hover .article-id { -webkit-text-stroke: 1px var(--bg-color); transform: scale(1.1); }

        @media screen and (max-height: 500px) {
            #ui-layer { padding: 2vh 3vw; }
            .content-box { width: calc(100vw - 120px); } 
            .search-box input { padding: 1vh 2vw; }
        }
        #fx-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; pointer-events: none; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">[ REVERSE ]</button>
    <div class="bg-layer"><div class="block-wedge"></div><div class="block-grey"></div><div class="line-rule"></div></div>

    <div id="ui-layer">
        <div class="content-box">
            <div class="header-data">
                <span class="menu-trigger" onclick="window.location.href=''index.html'">[ < RETURN ]</span>
                <span id="time-display">TIME: --</span>
                <span style="color: var(--accent-color);">[ ARCHIVE_DATABASE ]</span>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="[ SEARCH_ARCHIVES... ]" oninput="filterArticles()">
            </div>

            <div class="article-list" id="article-list-container"></div>
        </div>
    </div>

    <canvas id="fx-canvas"></canvas>

    <script>
        const listContainer = document.getElementById('article-list-container');

        // 直接使用 posts.js 里的数据，无需等待
        function renderArticles(dataArray) {
            listContainer.innerHTML = "";
            
            if (dataArray.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding: 40px; border: 1px dashed var(--accent-color); color:var(--text-color); font-family:'Courier New';">[ 未检测到任何文章 ]</div>`;
                return;
            }

            // 渲染列表
            dataArray.forEach(article => {
                const item = document.createElement('div');
                item.className = 'article-item';
                // 跳转时把 id 带过去
                item.onclick = () => window.location.href = `ixi.html?id=${article.id}`; 
                item.innerHTML = `
                    <div class="article-info">
                        <div class="article-title">${article.title}</div>
                        <div class="article-meta">DATE: ${article.date} // TAG: ${article.tag}</div>
                    </div>
                    <div class="article-id">${article.id}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        // 搜索过滤
        function filterArticles() {
            const kw = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPosts.filter(a => a.title.toLowerCase().includes(kw) || a.tag.toLowerCase().includes(kw));
            renderArticles(filtered);
        }

        // 初始化渲染
        renderArticles(allPosts);

        // 时间与主题
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
        function updateTime() { const now = new Date(); document.getElementById('time-display').innerText = `TIME: ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`; }
        updateTime(); setInterval(updateTime, 1000);
    </script>
</body>
</html>
